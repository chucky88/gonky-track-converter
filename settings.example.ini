; OPTIONAL settings. Copy this file as  settings.ini  (at the repo root) only if you want to change
; something. By default everything lives INSIDE the repo:
;   omtt/       Open Madness Track Tools (submodule)      textures/   the CC0 ones (download_textures.py)
;   work/       one folder per track, with the zip         tools/PCarsTools-bin/  PCarsTools.exe
; Any value can also be set with an environment variable  AMS2TC_<KEY>
; (e.g.  AMS2TC_WORK=D:\conversions).

[paths]
; Work folder: needs SPACE (each version of a big track takes 1-2 GB).
; work = D:\conversions

; Your AMS2 folder (the one with oo2core_4_win64.dll): only for open_bff.py
; game = C:\Program Files (x86)\Steam\steamapps\common\Automobilista 2

; Programs, if they're not on your PATH:
; blender   = C:\Program Files\Blender Foundation\Blender 4.3\blender.exe
; im_magick = C:\Program Files\ImageMagick-7.1.1-Q16-HDRI\magick.exe

; Other locations (normally you don't need to touch these):
; omtt       = D:\tools\Open-Madness-Track-Tools
; textures   = D:\conversions\textures
; pcarstools = D:\tools\PCarsTools\PCarsTools.exe
; Linux/macOS: wine prefix for the physics cooker, and the one for PCarsTools (with .NET 6)
; wine_prefix = ~/.wine-omtt
; wine_prefix_pcarstools = ~/.wine
